name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install GTK/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            appstream desktop-file-utils dpkg-dev python3-pil \
            systemd udev \
            flatpak flatpak-builder jq \
            file findutils libgdk-pixbuf-2.0-dev libgirepository1.0-dev \
            libglib2.0-dev-bin librsvg2-dev patchelf squashfs-tools

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Packaging Script Tests
        run: |
          packaging/scripts/test-install-dev.sh
          packaging/scripts/test-debian-maintainer-scripts.sh

      - name: Package Foundations
        run: |
          ROG_HELPER_BUILD_APPIMAGE=0 \
          ROG_HELPER_BUILD_RPM=0 \
          packaging/scripts/build-release-assets.sh dist/ci
          packaging/scripts/stage-apt-repo.sh dist/ci dist/ci/apt-repo-preview

      - name: Validate Final Debian Package
        run: |
          packages=(dist/ci/rog-helper_*.deb)
          [[ "${#packages[@]}" -eq 1 && -f "${packages[0]}" ]]
          packaging/scripts/check-deb-package.sh "${packages[0]}"
          packaging/scripts/test-deb-lifecycle.py "${packages[0]}"

      - name: Validate Flatpak Manifest
        run: packaging/scripts/build-flatpak.sh --check

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install AppImage Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl \
            libgtk-4-dev libadwaita-1-dev \
            appstream desktop-file-utils python3-pil \
            file findutils libgdk-pixbuf-2.0-dev libgdk-pixbuf2.0-bin \
            libgirepository1.0-dev libglib2.0-dev-bin librsvg2-dev \
            patchelf squashfs-tools

      - name: Verify AppImage Host Tools
        run: packaging/scripts/build-appimage.sh --check-deps

      - name: Build AppImage
        run: packaging/scripts/build-appimage.sh dist/appimage-ci

      - name: Upload AppImage Diagnostic Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-debug-${{ github.sha }}
          path: dist/appimage-ci/*.log
          if-no-files-found: ignore

  fedora-rpm:
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Install Fedora Build Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust gcc \
            pkgconf-pkg-config gtk4-devel libadwaita-devel \
            appstream desktop-file-utils python3-pillow \
            rpm-build systemd-rpm-macros

      - name: Build Fedora RPM
        run: packaging/scripts/build-rpm.sh dist/fedora-ci

      - name: Inspect RPM Contents
        run: rpm -qpl dist/fedora-ci/*.rpm | sed -n '1,200p'
