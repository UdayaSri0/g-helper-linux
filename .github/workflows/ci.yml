name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install GTK/libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            appstream desktop-file-utils dpkg-dev python3-pil \
            file findutils libgdk-pixbuf-2.0-dev libgirepository1.0-dev \
            libglib2.0-dev-bin librsvg2-dev patchelf squashfs-tools

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Package Foundations
        run: |
          packaging/scripts/build-release-assets.sh dist/ci
          packaging/scripts/stage-apt-repo.sh dist/ci dist/ci/apt-repo-preview

  fedora-rpm:
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - uses: actions/checkout@v4

      - name: Install Fedora Build Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust gcc \
            pkgconf-pkg-config gtk4-devel libadwaita-devel \
            appstream desktop-file-utils python3-pillow \
            rpm-build

      - name: Build Fedora RPM
        run: packaging/scripts/build-rpm.sh dist/fedora-ci

      - name: Inspect RPM Contents
        run: rpm -qpl dist/fedora-ci/*.rpm | sed -n '1,200p'
