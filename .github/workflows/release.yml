name: Release

on:
  push:
    tags:
      - "v*"
  # Enables a safe, explicit re-dispatch after repairing a release tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_release.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install Release Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl \
            libgtk-4-dev libadwaita-1-dev \
            appstream desktop-file-utils dpkg-dev python3-pil \
            systemd udev \
            file findutils libgdk-pixbuf-2.0-dev libgdk-pixbuf2.0-bin \
            libgirepository1.0-dev \
            libglib2.0-dev-bin librsvg2-dev patchelf squashfs-tools

      - name: Verify Tag Matches Workspace Version
        env:
          GIT_REF: ${{ github.ref }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python3 -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          EXPECTED_TAG="v${VERSION}"
          if [[ "$GIT_REF" != refs/tags/v* ]]; then
            echo "release workflow must run from a version tag" >&2
            exit 1
          fi
          ACTUAL_TAG="${GIT_REF#refs/tags/}"
          if [[ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]]; then
            echo "expected tag: $EXPECTED_TAG" >&2
            echo "actual tag: $ACTUAL_TAG" >&2
            echo "workspace version: $VERSION" >&2
            exit 1
          fi
          echo "Release tag matches workspace version: $ACTUAL_TAG"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Packaging Script Tests
        run: |
          packaging/scripts/test-install-dev.sh
          packaging/scripts/test-debian-maintainer-scripts.sh
          packaging/scripts/test-appimage-gtk-plugin.sh
          packaging/scripts/test-appimage-tool-integrity.sh
          python3 packaging/scripts/test-release-workflow.py

      - name: Clean Release Output
        run: rm -rf -- dist

      - name: Build Release Assets
        run: ROG_HELPER_BUILD_APPIMAGE=0 ROG_HELPER_BUILD_RPM=0 packaging/scripts/build-release-assets.sh dist

      - name: Validate Final Debian Package
        run: |
          packages=(dist/rog-helper_*.deb)
          printf 'Debian release candidates:\n'
          printf '  %s\n' "${packages[@]}"
          [[ "${#packages[@]}" -eq 1 && -f "${packages[0]}" ]]
          packaging/scripts/check-deb-package.sh "${packages[0]}"
          packaging/scripts/test-deb-lifecycle.py "${packages[0]}"

      - name: Verify AppImage Host Tools
        run: packaging/scripts/build-appimage.sh --check-deps

      - name: Build AppImage
        run: ROG_HELPER_SKIP_PREPARE=1 ROG_HELPER_WRITE_SHA256SUMS=1 packaging/scripts/build-appimage.sh dist

      - name: Upload AppImage Diagnostic Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage-debug-${{ github.ref_name }}
          path: dist/*.log
          if-no-files-found: ignore

      - name: Stage APT Repository Preview
        run: packaging/scripts/stage-apt-repo.sh dist dist/apt-repo-preview

      - name: Upload Release Package Artifacts
        id: upload_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages-${{ github.ref_name }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.xz
            dist/rog-helper
            dist/rog-helperd
            dist/rog-helper-ui
            dist/*SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload APT Repository Preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-repo-preview-${{ github.ref_name }}
          path: dist/apt-repo-preview/
          if-no-files-found: error

  fedora-rpm:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_rpm.outputs.artifact-id }}
    container: fedora:42
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Fedora Build Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust gcc \
            pkgconf-pkg-config gtk4-devel libadwaita-devel \
            appstream desktop-file-utils python3-pillow \
            rpm-build systemd-rpm-macros

      - name: Verify Tag Matches Workspace Version
        env:
          GIT_REF: ${{ github.ref }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python3 -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          EXPECTED_TAG="v${VERSION}"
          if [[ "$GIT_REF" != refs/tags/v* ]]; then
            echo "release workflow must run from a version tag" >&2
            exit 1
          fi
          ACTUAL_TAG="${GIT_REF#refs/tags/}"
          if [[ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]]; then
            echo "expected tag: $EXPECTED_TAG" >&2
            echo "actual tag: $ACTUAL_TAG" >&2
            echo "workspace version: $VERSION" >&2
            exit 1
          fi
          echo "Release tag matches workspace version: $ACTUAL_TAG"

      - name: Build Fedora RPM
        run: packaging/scripts/build-rpm.sh dist

      - name: Upload Fedora RPM Artifact
        id: upload_rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora-rpm-${{ github.ref_name }}
          path: |
            dist/*.rpm
            dist/*RPM-SHA256SUMS.txt
          if-no-files-found: error

  verify-release-assets:
    needs: [linux-release, fedora-rpm]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.linux-release.outputs.artifact_id }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.fedora-rpm.outputs.artifact_id }}
          path: ${{ runner.temp }}/rpm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install RPM metadata reader
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Verify exact candidate inventory and provenance
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 packaging/scripts/verify-release-assets.py \
            --linux-dir "$RUNNER_TEMP/linux" --rpm-dir "$RUNNER_TEMP/rpm" \
            --output-dir "$RUNNER_TEMP/verified" --provenance "$RUNNER_TEMP/provenance.txt" \
            --tag "$TAG" --commit "$COMMIT" --run-id "$RUN_ID"
      - name: Upload single verified release bundle
        id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ github.run_id }}
          path: ${{ runner.temp }}/verified/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload readable verification provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/provenance.txt
          if-no-files-found: error
          retention-days: 90
    outputs:
      bundle_artifact_id: ${{ steps.bundle.outputs.artifact-id }}

  verify-release-environment:
    needs: verify-release-assets
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read saved release environment protections
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          base="$API_URL/repos/$REPOSITORY/environments/release-publish"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$base" > "$RUNNER_TEMP/environment.json"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$base/deployment-branch-policies" > "$RUNNER_TEMP/policies.json"
          python3 packaging/scripts/check-release-environment.py --environment "$RUNNER_TEMP/environment.json" --policies "$RUNNER_TEMP/policies.json" --actor "$ACTOR"

  publish-release:
    needs: [verify-release-assets, verify-release-environment]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify-release-assets.outputs.bundle_artifact_id }}
          path: dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require matching release notes
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = v0.4.1 && test -s "docs/releases/$TAG.md"
      - name: Add verified provenance to the draft notes
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cp "docs/releases/$TAG.md" "$RUNNER_TEMP/release-body.md"
          printf '\n\n---\n\nVerified build provenance\n\n- Tag: `%s`\n- Commit: `%s`\n- GitHub Actions run: `%s`\n' \
            "$TAG" "$COMMIT" "$RUN_ID" >> "$RUNNER_TEMP/release-body.md"
      - name: Create protected draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/rog-helper_0.4.1_amd64.deb
            dist/rog-helper-0.4.1-1.x86_64.rpm
            dist/rog-helper-v0.4.1-x86_64.AppImage
            dist/rog-helper-0.4.1-linux-x86_64.tar.xz
            dist/rog-helper
            dist/rog-helperd
            dist/rog-helper-ui
            dist/rog-helper-0.4.1-SHA256SUMS.txt
            dist/rog-helper-0.4.1-RPM-SHA256SUMS.txt
          body_path: ${{ runner.temp }}/release-body.md
          draft: true
          target_commitish: ${{ github.sha }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
