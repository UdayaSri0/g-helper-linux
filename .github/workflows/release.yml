name: Release

on:
  push:
    tags:
      - "v*"
  # Enables a safe, explicit re-dispatch after repairing a release tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install Release Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl \
            libgtk-4-dev libadwaita-1-dev \
            appstream desktop-file-utils dpkg-dev python3-pil \
            systemd udev \
            file findutils libgdk-pixbuf-2.0-dev libgdk-pixbuf2.0-bin \
            libgirepository1.0-dev \
            libglib2.0-dev-bin librsvg2-dev patchelf squashfs-tools

      - name: Verify Tag Matches Workspace Version
        env:
          GIT_REF: ${{ github.ref }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python3 -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          EXPECTED_TAG="v${VERSION}"
          if [[ "$GIT_REF" != refs/tags/v* ]]; then
            echo "release workflow must run from a version tag" >&2
            exit 1
          fi
          ACTUAL_TAG="${GIT_REF#refs/tags/}"
          if [[ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]]; then
            echo "expected tag: $EXPECTED_TAG" >&2
            echo "actual tag: $ACTUAL_TAG" >&2
            echo "workspace version: $VERSION" >&2
            exit 1
          fi
          echo "Release tag matches workspace version: $ACTUAL_TAG"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Packaging Script Tests
        run: |
          packaging/scripts/test-install-dev.sh
          packaging/scripts/test-debian-maintainer-scripts.sh
          packaging/scripts/test-appimage-gtk-plugin.sh
          packaging/scripts/test-appimage-tool-integrity.sh
          python3 packaging/scripts/test-release-workflow.py

      - name: Clean Release Output
        run: rm -rf -- dist

      - name: Build Release Assets
        run: ROG_HELPER_BUILD_APPIMAGE=0 ROG_HELPER_BUILD_RPM=0 packaging/scripts/build-release-assets.sh dist

      - name: Validate Final Debian Package
        run: |
          packages=(dist/rog-helper_*.deb)
          printf 'Debian release candidates:\n'
          printf '  %s\n' "${packages[@]}"
          [[ "${#packages[@]}" -eq 1 && -f "${packages[0]}" ]]
          packaging/scripts/check-deb-package.sh "${packages[0]}"
          packaging/scripts/test-deb-lifecycle.py "${packages[0]}"

      - name: Verify AppImage Host Tools
        run: packaging/scripts/build-appimage.sh --check-deps

      - name: Build AppImage
        run: ROG_HELPER_SKIP_PREPARE=1 ROG_HELPER_WRITE_SHA256SUMS=1 packaging/scripts/build-appimage.sh dist

      - name: Upload AppImage Diagnostic Logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage-debug-${{ github.ref_name }}
          path: dist/*.log
          if-no-files-found: ignore

      - name: Stage APT Repository Preview
        run: packaging/scripts/stage-apt-repo.sh dist dist/apt-repo-preview

      - name: Upload Release Package Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages-${{ github.ref_name }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.xz
            dist/rog-helper
            dist/rog-helperd
            dist/rog-helper-ui
            dist/*SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload APT Repository Preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-repo-preview-${{ github.ref_name }}
          path: dist/apt-repo-preview/
          if-no-files-found: error

  fedora-rpm:
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Fedora Build Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust gcc \
            pkgconf-pkg-config gtk4-devel libadwaita-devel \
            appstream desktop-file-utils python3-pillow \
            rpm-build systemd-rpm-macros

      - name: Verify Tag Matches Workspace Version
        env:
          GIT_REF: ${{ github.ref }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python3 -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          EXPECTED_TAG="v${VERSION}"
          if [[ "$GIT_REF" != refs/tags/v* ]]; then
            echo "release workflow must run from a version tag" >&2
            exit 1
          fi
          ACTUAL_TAG="${GIT_REF#refs/tags/}"
          if [[ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]]; then
            echo "expected tag: $EXPECTED_TAG" >&2
            echo "actual tag: $ACTUAL_TAG" >&2
            echo "workspace version: $VERSION" >&2
            exit 1
          fi
          echo "Release tag matches workspace version: $ACTUAL_TAG"

      - name: Build Fedora RPM
        run: packaging/scripts/build-rpm.sh dist

      - name: Upload Fedora RPM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora-rpm-${{ github.ref_name }}
          path: |
            dist/*.rpm
            dist/*RPM-SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    needs: [linux-release, fedora-rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages-${{ github.ref_name }}
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fedora-rpm-${{ github.ref_name }}
          path: dist

      - name: Detect Release Notes
        id: release_notes
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          path="docs/releases/${GIT_TAG}.md"
          if [[ -f "$path" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release With Notes
        if: steps.release_notes.outputs.present == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.xz
            dist/rog-helper
            dist/rog-helperd
            dist/rog-helper-ui
            dist/*SHA256SUMS.txt
            dist/*.rpm
            dist/*RPM-SHA256SUMS.txt
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true

      - name: Publish Release
        if: steps.release_notes.outputs.present != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.xz
            dist/rog-helper
            dist/rog-helperd
            dist/rog-helper-ui
            dist/*SHA256SUMS.txt
            dist/*.rpm
            dist/*RPM-SHA256SUMS.txt
          fail_on_unmatched_files: true
