name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RELEASE_FILES: |
    dist/*.deb
    dist/*.AppImage
    dist/*.tar.xz
    dist/rog-helper
    dist/rog-helperd
    dist/rog-helper-ui
    dist/*SHA256SUMS.txt

permissions:
  contents: write

jobs:
  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Release Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            appstream desktop-file-utils dpkg-dev python3-pil \
            file findutils libgdk-pixbuf-2.0-dev libgirepository1.0-dev \
            libglib2.0-dev-bin librsvg2-dev patchelf squashfs-tools

      - name: Verify Tag Matches Workspace Version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python3 - <<'PY'
from pathlib import Path
import tomllib

workspace = tomllib.loads(Path("Cargo.toml").read_text())
print(workspace["workspace"]["package"]["version"])
PY
)"
          test "v${VERSION}" = "$GIT_TAG"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Release Assets
        run: packaging/scripts/build-release-assets.sh dist

      - name: Stage APT Repository Preview
        run: packaging/scripts/stage-apt-repo.sh dist dist/apt-repo-preview

      - name: Upload Release Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.ref_name }}
          path: ${{ env.RELEASE_FILES }}
          if-no-files-found: error

      - name: Upload APT Repository Preview
        uses: actions/upload-artifact@v4
        with:
          name: apt-repo-preview-${{ github.ref_name }}
          path: dist/apt-repo-preview/
          if-no-files-found: error

      - name: Detect Release Notes
        id: release_notes
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          path="docs/releases/${GIT_TAG}.md"
          if [[ -f "$path" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release With Notes
        if: steps.release_notes.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_FILES }}
          body_path: ${{ steps.release_notes.outputs.path }}
          fail_on_unmatched_files: true

      - name: Publish Release
        if: steps.release_notes.outputs.present != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_FILES }}
          fail_on_unmatched_files: true
